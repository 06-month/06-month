# Regenerates the contribution-graph snake animation and publishes it to the
# `output` branch, where README.md reads it from raw.githubusercontent.com.
#
# Runs daily at 03:00 KST, on every push to main, and on demand from the
# Actions tab. Nothing is committed to main — the SVGs live only on `output`.

name: generate snake

on:
  schedule:
    - cron: "0 18 * * *"      # 18:00 UTC = 03:00 KST
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1A3A5C
            dist/snake-dark.svg?palette=github-dark&color_snake=#6FA8DC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
